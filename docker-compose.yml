services:
  frozenfoodpanda:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_DATABASE=/var/www/html/database/database.sqlite
    restart: unless-stopped